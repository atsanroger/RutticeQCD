[workspace]
resolver = "2"
members = ["kernel", "core", "io", "gauge", "fermion", "solver", "measure", "validation"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
ruttice-kernel = { path = "kernel" }
ruttice-core = { path = "core" }
ruttice-io = { path = "io" }
ruttice-gauge = { path = "gauge" }
ruttice-fermion = { path = "fermion" }
ruttice-solver = { path = "solver" }
ruttice-measure = { path = "measure" }
rayon = "1"

[workspace.lints.clippy]
# Lattice, spin and colour indices (mu, a, c) are written as explicit index loops so the
# code reads like the formulas it implements.
needless_range_loop = "allow"

[profile.release]
opt-level = 3
codegen-units = 1

[profile.test]
opt-level = 2
