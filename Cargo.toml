[workspace]
resolver = "2"
members = ["kernel", "core", "io", "gauge", "validation"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
ruttice-kernel = { path = "kernel" }
ruttice-core = { path = "core" }
ruttice-io = { path = "io" }
ruttice-gauge = { path = "gauge" }
rayon = "1"

[profile.release]
opt-level = 3
codegen-units = 1

[profile.test]
opt-level = 2
