# One package: the library in src/, the programs in apps/, tests in tests/, examples in
# examples/.
[package]
name = "ruttice"
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

description = "A Rust library and toolkit for lattice QCD simulations"
homepage = "https://github.com/atsanroger/RutticeQCD"
repository = "https://github.com/atsanroger/RutticeQCD"
readme = "README.md"
keywords = ["lattice-qcd", "qcd", "physics", "multigrid", "cuda"]
categories = ["science", "simulation"]

[[bin]]
name = "ruttice"
path = "apps/ruttice.rs"

# Times the Wilson operator on one process.
[[bin]]
name = "ruttice-bench"
path = "apps/bench.rs"

[[bin]]
name = "ruttice-flow"
path = "apps/flow.rs"

[[bin]]
name = "ruttice-flow-mpi"
path = "apps/flow_mpi.rs"
required-features = ["mpi"]

# The same benchmark on several processes.
[[bin]]
name = "ruttice-bench-mpi"
path = "apps/bench_mpi.rs"
required-features = ["mpi"]

# Times the operators and a solve on the GPU against the CPU.
# The lowest singular values of the domain-wall operator and their chirality, on the GPU.
[[bin]]
name = "ruttice-low-modes"
path = "apps/low_modes.rs"
required-features = ["cuda-bridge"]

[[bin]]
name = "ruttice-bench-cuda"
path = "apps/bench_cuda.rs"
required-features = ["cuda-bridge"]

# The same program on several processes.
[[bin]]
name = "ruttice-mpi"
path = "apps/ruttice_mpi.rs"
required-features = ["mpi"]

# Compares the operator and a solve on several MPI processes with one process; run by the
# test `mpirun`.
[[bin]]
name = "ruttice-mpi-check"
path = "apps/mpi_check.rs"
required-features = ["mpi"]

[[test]]
name = "mpirun"
required-features = ["mpi"]

# Examples on the device only.
[[example]]
name = "dminus_cost"
required-features = ["cuda-bridge"]

[[example]]
name = "dual_basis"
required-features = ["cuda-bridge"]

[[test]]
name = "mpi_program"
required-features = ["mpi"]

[features]
# The communicator on MPI (`backend::mpi`) and the programs that use it. Needs an MPI
# installation and libclang to build.
mpi = ["dep:mpi"]
# Gauge configurations in HDF5 files (`io::hdf5`). Needs the HDF5 library to build.
hdf5 = ["dep:hdf5", "dep:ndarray"]
# The CUDA kernels of `cuda_bridge/` (from Bridge++) and the backend on them
# (`backend::cuda_bridge`). Needs the CUDA toolkit and cmake to build, and an NVIDIA GPU to run.
cuda-bridge = []
# The faces of the operators on several processes exchanged by NCCL between the devices
# (`backend::cuda_bridge`, `halo`): NVLink or PCIe peer copies within a node, GPUDirect RDMA
# between nodes. Needs NCCL (`NCCL_HOME`) to build; without it the faces go through the host.
nccl = ["cuda-bridge"]

[dependencies]
rayon = "1"
mpi = { version = "0.8", optional = true }
# HDF5 files, and the arrays its interface is written in.
hdf5 = { version = "0.8", optional = true }
ndarray = { version = "0.15", optional = true }
# Parameter files (`app`).
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_yaml_ng = "0.10"

# Binding threads to processors (`lattice::pool`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.clippy]
# Lattice, spin and colour indices (mu, a, c) are written as explicit index loops so the
# code reads like the formulas it implements.
needless_range_loop = "allow"

[profile.release]
opt-level = 3
codegen-units = 1

[profile.test]
opt-level = 2
