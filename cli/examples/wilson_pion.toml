# Pion correlator with Wilson fermions from a point source.
#
#   cargo run --release -p ruttice-cli -- cli/examples/wilson_pion.toml
#
# Relative paths are taken from the directory of this file.

lattice = [4, 4, 4, 8]

[gauge]
file = "conf_04040408.txt"      # plain text, one real per line
format = "bridge_text"          # the only format so far; may be omitted

[solver]
type = "cg_normal"              # cg_normal | bicgstab
even_odd = true                 # default true; needs even lattice extents
tolerance_squared = 1.0e-28     # on |r|^2 / |b|^2, for every right-hand side
max_iterations = 2000           # per restart
max_restarts = 3                # default 3

[[quark]]
fermion = { type = "wilson", kappa = 0.12, boundary = ["antiperiodic", "antiperiodic", "antiperiodic", "antiperiodic"] }
source = { type = "point", position = [0, 0, 0, 0] }

[measure]
channels = ["PS"]               # omit to get all of: PS V1 V2 V3 A4_PS PS_A4 S G51 G52 G53 S12 S23 S31

[output]
file = "wilson_pion.out"        # optional; the table is always printed as well
