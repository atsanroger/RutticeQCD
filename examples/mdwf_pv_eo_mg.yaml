# Möbius domain-wall fermions on the even sites with the multigrid:
#
#   cargo run --release --bin ruttice -- examples/mdwf_pv_eo_mg.yaml
#
# on the v2 12^4 configuration (quenched, beta 6.0; not part of the repository) next to this
# file. This is setup S of docs/mg_background/MDWF_MULTIGRID_NOTE.pdf: M5 = 1.0 on stout
# links 0.1 x 3. For setup B: domain_wall_height 1.8, the GaugeSmearing section removed, and
# Smoother number_of_steps 12, interval_ratio 30. These are the only two domain-wall setups
# the multigrid was tuned and measured for. The sections and
# keys are those of Bridge++. Keywords (values of choices) may be written in any case and
# with or without `_`: CGNE, cgne and Cg_Ne are the same. Keys are spelt as below.
# Every key with a default is shown with it.

Main:
  lattice_size  : [12, 12, 12, 12]
  grid_size     : [1, 1, 1, 1]
  ## backend = {cpu, simd}: simd keeps simd_lanes sites (2, 4 or 8) in one SIMD register
  backend       : cpu
  simd_lanes    : 4
  ## verbose_level = {Crucial, General, Detailed, Paranoiac}
  verbose_level : General

Gauge:
  gauge_config_type_input : Binary
  ## relative paths are taken from this file's directory
  config_filename_input   : conf_quench_12x12x12x12_v2.bin

Fopr:
  ## fermion_type = {Domainwall_5din (Mobius)}
  fermion_type             : Domainwall_5din
  gamma_matrix_type        : Dirac
  quark_mass               : 0.001
  quark_mass_PauliVillars  : 1.0
  domain_wall_height       : 1.0
  extent_of_5th_dimension  : 8
  coefficient_b            : 1.5
  coefficient_c            : 0.5
  boundary_condition       : [1, 1, 1, -1]
  ## Neff's alpha, D^(alpha) = D Q. It cancels with operator_type PV_right; with PV_left put it
  ## into D alone (alpha in 0.5-0.7 saves about 10% of the multigrid cycles on 12^4).
  neff_alpha               : 0.6
  neff_alpha_PauliVillars  : 1.0

Solver:
  ## solver_type = {GCR, Block_GCR (the right-hand sides of a solve share their directions;
  ##                on 12^4 as many steps as GCR and more time),
  ##                BiCGStab, FGMRES, CG (= CGNE)}
  solver_type                   : GCR
  ## operator_type = {PV_right (A'), PV_left (A' with alpha), Normal_left (CGNE)};
  ## by default Normal_left for CG and PV_right otherwise
  operator_type                 : PV_left
  ## GCR: directions kept (memory 2k + 4 vectors); FGMRES: size of the Krylov space
  number_of_kept_directions     : 2
  maximum_number_of_iteration   : 2000
  maximum_number_of_restart     : 0
  convergence_criterion_squared : 1.0e-18
  ## preconditioner_type = {None, Chebyshev, MG}; the MultiGrid section may stay when it is
  ## not used (a note is printed)
  preconditioner_type           : MG

## The multigrid, used with preconditioner_type MG. It may instead come from a file of its
## own, shared by several parameter files: `MultiGrid_file : mg.yaml` (holding a MultiGrid
## section like this one).
MultiGrid:
  ## coarse_precision = {single, double}: the coarse operators and solves
  coarse_precision : single
  ## fine_precision = {single, double}: the setup and the cycle above the coarse lattice (the
  ## outer solver is in double precision)
  fine_precision   : single
  ## basis_precision = {half, single}: with backend cuda_bridge, how the prolongation is kept,
  ## which is most of the memory of the multigrid
  basis_precision  : half
  Setup:
    ## Chebyshev-filtered subspace iteration on A^dag A, then the multigrid bootstrap
    filter_number_of_vectors   : 16
    filter_number_of_rounds    : 2
    filter_number_in_block     : 4
    bootstrap_number_of_rounds : 2
    bootstrap_number_of_steps  : 4
    seed                       : 21
    ## low modes from a checkpoint file (study program mdwf_evenodd_coherence, tag mdwf-mg-studies) instead of the filter:
    # checkpoint : ../run/eoeig_ckpt_12_1_0.005_8_16_26.bin
  ## The smoother, a Chebyshev polynomial of A~ on [hi/interval_ratio, hi], hi = 1.1 |lambda_max|.
  ## It is not chosen from the operator; it has to suit the setup:
  ##   M5 = 1.0 with stout 0.1 x 3: number_of_steps 8, interval_ratio 10 (the default)
  ##   M5 = 1.8 without smearing:   number_of_steps 12, interval_ratio 30
  ## A wrong one can make the solve stagnate (stout 12^4 at m = 0.001 with 5 steps on
  ## [hi/30, hi]: |r|^2 about 1e-5 after 2000 iterations).
  Smoother:
    smoother_type   : Chebyshev
    number_of_steps : 8
    interval_ratio  : 10
  MultiGrid_Level1:
    block_size             : [4, 4, 4, 4]
    number_of_test_vectors : 32
    ## the quark factor P^dag D P: {BiCGStab, GCR}
    Coarse_Solver_D:
      solver_type                   : BiCGStab
      maximum_number_of_iteration   : 2000
      convergence_criterion_squared : 1.0e-2
    ## the second factor P^dag D_PV^dag P (P^dag D^dag P with Normal_left):
    ## {MINRES (not with Normal_left), BiCGStab, GCR}
    Coarse_Solver_PV:
      solver_type                   : MINRES
      maximum_number_of_iteration   : 2000
      convergence_criterion_squared : 1.0e-2
  ## Levels below the coarse lattice for the solves of P^dag D P (optional, up to
  ## MultiGrid_Level4): super-blocks of super_block_size sites of the level above per
  ## direction; the last level is solved exactly, so keep it small. On 16^4 in blocks of
  ## 4^4 (4^4 coarse sites), Level2 + Level3 of 2 end in one site.
  ## levels_for_pauli_villars : true   # the levels also under the Pauli-Villars factor (MINRES);
  ##                                   # on 16^4 it cost more coarse applications, not fewer
  # MultiGrid_Level2:
  #   super_block_size : 2
  # MultiGrid_Level3:
  #   super_block_size : 2

## Gauge smearing: the operators are made of the smeared links (setup S; remove for setup B).
GaugeSmearing:
  smear_type         : Stout
  rho_uniform        : 0.1
  number_of_smearing : 3
