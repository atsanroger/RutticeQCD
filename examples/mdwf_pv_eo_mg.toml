# The same run as examples/mdwf_pv_eo_mg.yaml, in TOML, with the multigrid from a file of
# its own (examples/mg_pv_eo.yaml), which other parameter files can share. Keys left out
# take their defaults.

MultiGrid_file = "mg_pv_eo.yaml"

[Main]
lattice_size = [12, 12, 12, 12]
backend = "cpu"

[Gauge]
gauge_config_type_input = "Binary"
config_filename_input = "conf_quench_12x12x12x12_v2.bin"

[Fopr]
fermion_type = "Mobius"
quark_mass = 0.001
domain_wall_height = 1.0
extent_of_5th_dimension = 8
neff_alpha = 0.6

[Solver]
solver_type = "gcr"
operator_type = "pv_left"
convergence_criterion_squared = 1e-18
preconditioner_type = "mg"

# Setup S: M5 = 1.0 on stout links (see examples/mdwf_pv_eo_mg.yaml for setup B).
[GaugeSmearing]
smear_type = "Stout"
rho_uniform = 0.1
number_of_smearing = 3
