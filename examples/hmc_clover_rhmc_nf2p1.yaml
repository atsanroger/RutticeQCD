# HMC with 2 + 1 flavours of clover fermions on stout links, with the Iwasaki gauge action:
# Bridge++'s test_HMC_Clover_RHMC_Nf2p1. One trajectory from conf_04040408.txt ends at the
# plaquette 0.627668186553629 (Bridge++).
#
#   cargo run --release --bin ruttice -- examples/hmc_clover_rhmc_nf2p1.yaml
#
# Relative paths are taken from the directory of this file.

Main:
  lattice_size : [4, 4, 4, 8]
HMC:
  gauge_config_status     : Continue
  gauge_config_type_input : Text
  config_filename_input   : conf_04040408.txt
  trajectory_number       : 200000
  number_of_trajectories  : 1
HMC_General:
  trajectory_length : 0.1
Builder_Integrator:
  integrator      : Leapfrog
  number_of_steps : [5, 2, 3]             # the outer level first
  order_of_exp_iP : 8
GaugeSmearing:
  smear_type         : Stout
  rho_uniform        : 0.1
  number_of_smearing : 2

Action_G:
  action_type     : Action_G_Rectangle
  beta            : 2.3
  c_plaq          : 3.648
  c_rect          : -0.331
  level_of_action : 2

# A Solver section also takes solver_type : CG (default) | BiCGStab | FGMRES | GCR, and
# preconditioner_type : Chebyshev (with CG) | MG (with the others); docs/USAGE.md has the keys.

# The light pair, Hasenbusch's way: det(D_0.13)² / det(D_0.11)² ...
Action_F_1:
  action_type     : Ratio
  level_of_action : 0
  Fopr:
    fermion_type       : Clover
    hopping_parameter  : 0.13
    clover_coefficient : 1.0
    boundary_condition : [1, 1, 1, -1]
  Fopr_denominator:
    fermion_type       : Clover
    hopping_parameter  : 0.11
    clover_coefficient : 1.0
    boundary_condition : [1, 1, 1, -1]
  Solver:
    convergence_criterion_squared : 1.0e-28

# ... times det(D_0.11)².
Action_F_2:
  action_type     : Standard
  level_of_action : 1
  Fopr:
    fermion_type       : Clover
    hopping_parameter  : 0.11
    clover_coefficient : 1.0
    boundary_condition : [1, 1, 1, -1]
  Solver:
    convergence_criterion_squared : 1.0e-28

# The strange quark: det(D†D_0.12)^(1/2) by RHMC, 16 poles; the bounds are those of |D|
# (D†D in [1e-4, 10]). The coefficients are computed; `coefficients : <dir>` reads
# Bridge++'s files parameter_rational.* from a directory instead (the same numbers).
Action_F_3:
  action_type     : Rational
  level_of_action : 1
  Fopr:
    fermion_type       : Clover
    hopping_parameter  : 0.12
    clover_coefficient : 1.0
    boundary_condition : [1, 1, 1, -1]
  Rational:
    number_of_poles      : 16
    exponent_numerator   : 1
    exponent_denominator : 2
    lower_bound          : 1.0e-2
    upper_bound          : 3.16227766
  Solver:
    convergence_criterion_squared : 1.0e-28
    maximum_number_of_iteration   : 1000
