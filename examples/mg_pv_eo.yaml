# A multigrid section of its own, for `MultiGrid_file : mg_pv_eo.yaml` in parameter files
# (see examples/mdwf_pv_eo_mg.toml). Keys left out take their defaults
# (examples/mdwf_pv_eo_mg.yaml shows them all).

MultiGrid:
  coarse_precision : single
  # The smoother has to suit the setup (it is not chosen from the operator):
  #   M5 = 1.0 with stout 0.1 x 3: number_of_steps 8, interval_ratio 10 (the default)
  #   M5 = 1.8 without smearing:   number_of_steps 12, interval_ratio 30
  # Smoother:
  #   number_of_steps : 12
  #   interval_ratio  : 30
  MultiGrid_Level1:
    block_size             : [4, 4, 4, 4]
    number_of_test_vectors : 32
